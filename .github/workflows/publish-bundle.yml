name: Publish OPA Bundle

on:
  push:
    paths:
      - 'OPA/src/**'
  pull_request:
    paths:
      - 'OPA/src/**'

  schedule:
    - cron: '0 */12 * * *'
  
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download OPA CLI
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Set bundle version
        id: vars
        run: |
          if [[ "${GITHUB_REF_TYPE}" = "tag" ]]; then
            BUNDLE_TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            BUNDLE_TAG="${GITHUB_SHA::8}"
          else
            # Tag is equal to the branch name
            BUNDLE_TAG="${GITHUB_REF_NAME//\//-}"
          fi
          echo "Bundle tag: $BUNDLE_TAG"
          echo "BUNDLE_TAG=${BUNDLE_TAG}" >> $GITHUB_ENV

      - name: Download ODRL policies
        run: |
          ./scripts/get-policies.sh
        env:
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}

      - name: Add data file for API authorization
        run: |
          mkdir -p OPA/src/system/authz/policy
          cat <<EOF > OPA/src/system/authz/policy/data.yaml
          tokens:
          - issuer: https://iam-dev.cloud.cnaf.infn.it/
          - issuer: https://iam-riscale.cloud.cnaf.infn.it/
            groups:
            - urn:geant:ri-scale:group:opa-write
            client_id: ${IAM_INTROSPECT_CLIENT_ID}
            client_secret: ${IAM_INTROSPECT_CLIENT_SECRET}
          EOF
        env:
          IAM_INTROSPECT_CLIENT_SECRET: ${{ secrets.IAM_INTROSPECT_CLIENT_SECRET }}
          IAM_INTROSPECT_CLIENT_ID: ${{ secrets.IAM_INTROSPECT_CLIENT_ID }}

      - name: Build OPA bundle
        run: |
          opa build -b OPA/src --output dep.tar.gz

      - name: Install ORAS
        run: |
          ORAS_VERSION=1.2.0
          curl -fL -o oras.tar.gz \
            https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz
          tar -xzf oras.tar.gz
          sudo mv oras /usr/local/bin/

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push bundle to GHCR
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/opa-dep
          MT_CONF=application/vnd.oci.image.config.v1+json
          MT_IMAGE=application/vnd.oci.image.layer.v1.tar+gzip

          echo "{}" > manifest.config

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            oras push ${IMAGE}:latest --config manifest.config:${MT_CONF} dep.tar.gz:${MT_IMAGE}
          fi
          oras push ${IMAGE}:${BUNDLE_TAG} --config manifest.config:${MT_CONF} dep.tar.gz:${MT_IMAGE}

      - name: Bundle URL
        run: |
          echo "Bundle OCI URL: ghcr.io/${{ github.repository_owner }}/opa-dep:${BUNDLE_TAG}"
